        sel.addEventListener('change', () => {
          if (sel.value === '__upload') { sel.value = P.logo; document.getElementById('file').click(); return; }
          P.logo = sel.value;
          if (PRESETS[P.logo]) P.originalColors = PRESETS[P.logo].color;
          syncAll(); onParam('logo'); replay();
        });
      } else if (row.type === 'text') {
        node = el(`<label class="field"><span class="f-label">${row.label}</span><input type="text" class="text-in" id="${id}" maxlength="6" spellcheck="false" autocomplete="off"></label>`);
        const input = node.querySelector('input');
        let t;
        input.addEventListener('input', () => { P.text = input.value; clearTimeout(t); t = setTimeout(() => onParam('text'), 180); });
      } else if (row.type === 'color') {
        node = el(`<label class="field"><span class="f-label">${row.label}</span><span class="swatch-wrap"><span class="hex"></span><input type="color" class="swatch" id="${id}"></span></label>`);
        const input = node.querySelector('input');
        input.addEventListener('input', () => { P[row.key] = input.value; syncRow(row); onParam(row.key); });
      }
      rows[row.key] = { node, row };
      sec.appendChild(node);
    }
    groupsEl.appendChild(sec);
  }

  const exp = el(`<section class="group"><h2>Export</h2>
    <div class="btn-row"><button class="btn" id="savePng" type="button">Save PNG</button><button class="btn primary" id="saveVideo" type="button">Record Video</button></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <p class="note">PNG saves the frame on screen. Video records one full reveal, square, at twice the tile size.</p></section>`);
  groupsEl.appendChild(exp);
  statusEl = exp.querySelector('#status');
}

function logoOptions() {
  const opts = Object.entries(PRESETS).map(([k, v]) => [k, v.label]);
  opts.push(['text', 'Text']);
  if (uploadUrl) opts.push(['upload', 'Your logo']);
  opts.push(['__upload', 'Upload…']);
  return opts;
}

function syncRow(row) {
  const { node } = rows[row.key];
  const v = P[row.key];
  if (row.type === 'slider') {
    const input = node.querySelector('input');
    input.value = v;
    input.style.setProperty('--p', ((v - row.min) / (row.max - row.min) * 100).toFixed(2) + '%');
    node.querySelector('output').textContent = fmt(row, v);
  } else if (row.type === 'toggle') {
    node.querySelector('input').checked = !!v;
  } else if (row.type === 'select') {
    const sel = node.querySelector('select');
    sel.innerHTML = logoOptions().map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
    sel.value = v;
  } else if (row.type === 'text') {
    const input = node.querySelector('input');
    if (input.value !== v) input.value = v;
  } else if (row.type === 'color') {
    node.querySelector('input').value = v;
    node.querySelector('.hex').textContent = v.toUpperCase();
  }
  node.hidden = row.when ? !row.when(P) : false;
}
function syncAll() {
  for (const k in rows) syncRow(rows[k].row);
  document.querySelectorAll('[data-look]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.look === look)));
  stage.style.setProperty('--stage-bg', P.background);
  updateRange();
}

function setLook(name) {
  const logoBefore = P.logo;
  // Text the viewer typed carries over; a look's own sample word does not.
  const text = P.text === LOOKS[look].text ? LOOKS[name].text : P.text;
  look = name;
  P = { ...LOOKS[name], text };
  if (logoBefore === 'upload') { P.logo = 'upload'; }
  syncAll(); persist();
  refreshLogo();
  dirty = true; replay();
}

let logoJob = 0;
async function refreshLogo() {
  const job = ++logoJob;
  try {
    const [data, thenData] = await Promise.all([
      makeLogo(P.logo, { text: P.text, url: uploadUrl }),
      P.then ? makeLogo(nextOf(P).logo, {}) : null,
    ]);
    if (job !== logoJob) return;
    logoData = data;
    thenLogoData = thenData;
    dirty = true;
  } catch (e) {
    setStatus(e.message || 'This logo could not be loaded.');
  }
}

function onParam(key) {
  if (key === 'logo' || key === 'text') refreshLogo();
  if (key === 'present') updateRange();
  if (key === 'originalColors' || key === 'iconPlate') syncAll();
  if (key === 'background') stage.style.setProperty('--stage-bg', P.background);
  dirty = true;
  persist();
}

/* Uploads ----------------------------------------------------------- */
async function useFile(file) {
  if (!file) return;
  if (!/^image\/(svg\+xml|png|jpeg|webp)$/.test(file.type)) { setStatus('Use an SVG, PNG, JPG or WebP file.'); return; }
  try {
    if (file.type === 'image/svg+xml') uploadUrl = svgToUrl(await file.text());
    else uploadUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    P.logo = 'upload';
    P.originalColors = file.type !== 'image/svg+xml';
    syncAll();
    await refreshLogo();
    setStatus(`Using ${file.name}.`);
    replay();
  } catch (e) {
    setStatus(e.message || 'This file could not be read.');
  }
}
document.getElementById('file').addEventListener('change', e => { useFile(e.target.files[0]); e.target.value = ''; });
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('dropping'); });
stage.addEventListener('dragleave', () => stage.classList.remove('dropping'));
stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('dropping'); useFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (item) useFile(item.getAsFile());
});

/* Player ------------------------------------------------------------ */
const playBtn = document.getElementById('play');
const playIcon = document.getElementById('playIcon');
const scrub = document.getElementById('scrub');
const clock = document.getElementById('clock');
const loopBtn = document.getElementById('loop');
const speedSeg = document.getElementById('speed');
function updateRange() { scrub.max = String(endOf(P)); if (time > endOf(P)) { time = endOf(P); dirty = true; } }

function setPlaying(v) {
  playing = v;
  pauseLeft = 0;
  outro = 0;
  playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play');
  playIcon.innerHTML = v
    ? '<rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/>'
    : '<path d="M4.5 3.1v9.8a1 1 0 0 0 1.52.85l7.9-4.9a1 1 0 0 0 0-1.7l-7.9-4.9A1 1 0 0 0 4.5 3.1z"/>';
  lastNow = performance.now();
}
function replay() { time = 0; setPlaying(true); dirty = true; }
playBtn.addEventListener('click', () => { if (!playing && time >= endOf(P)) time = 0; setPlaying(!playing); });
document.getElementById('replay').addEventListener('click', replay);
scrub.addEventListener('input', () => { setPlaying(false); time = Number(scrub.value); dirty = true; });
loopBtn.setAttribute('aria-pressed', String(looping));
loopBtn.addEventListener('click', () => { looping = !looping; loopBtn.setAttribute('aria-pressed', String(looping)); });
speedSeg.querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    speed = Number(b.dataset.v);
    speedSeg.querySelectorAll('button').forEach(o => o.setAttribute('aria-checked', String(o === b)));
    lastNow = performance.now();
  });
});
document.getElementById('reset').addEventListener('click', () => setLook(look));

// Direct manipulation: drag across the stage to scrub, 1:1 with the pointer.
let drag = null;
view.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  view.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, t: time, wasPlaying: playing, moved: false };
  setPlaying(false);
});
view.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 3) drag.moved = true;
  const span = Math.max(240, visibleWidth() * 0.8);
  time = Math.min(endOf(P), Math.max(0, drag.t + dx / span * endOf(P)));
  dirty = true;
});
const endDrag = () => {
  if (!drag) return;
  if (!drag.moved) { if (drag.wasPlaying) setPlaying(true); else { if (time >= endOf(P)) time = 0; setPlaying(true); } }
  else if (drag.wasPlaying) setPlaying(true);
  drag = null;
};
view.addEventListener('pointerup', endDrag);
view.addEventListener('pointercancel', endDrag);
view.addEventListener('dblclick', replay);

window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input[type="text"], select, input[type="color"]')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onBody = e.target === document.body || e.target === view;
  if (e.code === 'Space' && (onBody || e.target === playBtn)) { e.preventDefault(); playBtn.click(); }
  else if ((e.key === 'r' || e.key === 'R') && !e.target.closest('input')) replay();
  else if (e.key === 'ArrowRight' && onBody) { setPlaying(false); time = Math.min(endOf(P), time + 1 / 60); dirty = true; }
  else if (e.key === 'ArrowLeft' && onBody) { setPlaying(false); time = Math.max(0, time - 1 / 60); dirty = true; }
});

/* Layout + loop ----------------------------------------------------- */
const floating = window.matchMedia('(min-width: 761px)');
function visibleWidth() {
  const w = view.clientWidth;
  if (!floating.matches || !inspector.offsetWidth) return w;
  return Math.max(200, w - inspector.offsetWidth - 24);
}
function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(view.clientWidth * dpr));
  const h = Math.max(1, Math.round(view.clientHeight * dpr));
  if (view.width !== w || view.height !== h) { view.width = w; view.height = h; dirty = true; }
  const vw = visibleWidth();
  app.style.setProperty('--vis-w', vw + 'px');
  app.style.setProperty('--vis-cx', vw / 2 + 'px');
  const transportRoom = transport.offsetHeight + 40;
  const vh = Math.max(160, view.clientHeight - transportRoom);
  const tileCss = Math.min(P.tileSize, Math.min(vw, vh) / 1.75);
  return { dpr, cx: vw / 2 * dpr, cy: (view.clientHeight - (vh / 2 + 10)) * dpr, tile: tileCss * dpr };
}

function tick(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000);
  lastNow = now;
  if (playing) {
    const end = endOf(P);
    if (pauseLeft > 0) {
      // Loop pause: hold the finished logo, then let it blur away so the next reveal starts from empty.
      pauseLeft -= dt;
      outro = clamp01(1 - pauseLeft / OUTRO);
      if (pauseLeft <= 0) { pauseLeft = 0; outro = 0; time = 0; }
    } else {
      time += dt * speed;
      if (time >= end) {
        time = end;
        if (looping) pauseLeft = Math.max(0.05, P.hold) + OUTRO; else setPlaying(false);
      }
    }
    dirty = true;
  }
  const L = layout();
  if (dirty && renderer && logoData) {
    renderShot(renderer, time, outro, view.width, view.height, L.tile, L.cx, L.cy);
    scrub.value = String(time);
    scrub.style.setProperty('--p', (time / endOf(P) * 100).toFixed(2) + '%');
    clock.textContent = time.toFixed(2) + ' s';
    dirty = false;
  }
  requestAnimationFrame(tick);
}

/* Export ------------------------------------------------------------ */
function offerFile(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  setStatus(`Saved ${filename}.`);
}

function exportSide() { return Math.round(P.tileSize * 1.9) * 2; }

function wireExport() {
  const pngBtn = document.getElementById('savePng');
  const vidBtn = document.getElementById('saveVideo');
  pngBtn.addEventListener('click', async () => {
    if (!logoData) return;
    const side = exportSide();
    const c = document.createElement('canvas');
    c.width = side; c.height = side;
    const r = createRenderer(c, { preserve: true });
    if (!r) return;
    renderShot(r, time, 0, side, side, P.tileSize * 2);
    const blob = await new Promise(res => c.toBlob(res, 'image/png'));
    r.dispose();
    offerFile(blob, `glass-reveal-${time.toFixed(2)}s.png`);
  });

  let recording = false;
  vidBtn.addEventListener('click', async () => {
    if (!logoData || recording) return;
    if (typeof MediaRecorder === 'undefined') { setStatus('This browser cannot record video.'); return; }
    const mime = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4']
      .find(m => MediaRecorder.isTypeSupported(m));
    if (!mime) { setStatus('This browser cannot record video.'); return; }
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    recording = true; vidBtn.disabled = true;
    const side = exportSide();
    const c = document.createElement('canvas');
    c.width = side; c.height = side;
    const r = createRenderer(c);
    const end = endOf(P), total = end + 0.3;
    renderShot(r, 0, 0, side, side, P.tileSize * 2);
    const stream = c.captureStream(60);
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(res => { rec.onstop = res; });
    rec.start();
    const t0 = performance.now() + 150;
    await new Promise(res => {
      const step = now => {
        const T = Math.max(0, (now - t0) / 1000 * speed);
        renderShot(r, Math.min(T, end), 0, side, side, P.tileSize * 2);
        setStatus(`Recording… ${Math.min(T, total).toFixed(2)} s`);
        if (T < total) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
    rec.stop();
    await stopped;
    stream.getTracks().forEach(t => t.stop());
    r.dispose();
    recording = false; vidBtn.disabled = false;
    offerFile(new Blob(chunks, { type: mime.split(';')[0] }), `glass-reveal.${ext}`);
  });
}

/* Boot -------------------------------------------------------------- */
buildInspector();
wireExport();
syncAll();
setPlaying(playing);
refreshLogo().then(() => { lastNow = performance.now(); dirty = true; });
requestAnimationFrame(t => { lastNow = t; tick(t); });
setTimeout(() => { const h = document.getElementById('hint'); if (h) h.style.opacity = '0'; }, 6000);

// Scripting hooks: seek, set parameters and render single frames (used to record the demo).
let snapRenderer = null, snapCanvas = null;
window.glassReveal = {
  seek(t) { setPlaying(false); time = t; dirty = true; },
  play: replay,
  setLook,
  set(key, value) { if (key in P) { P[key] = value; syncAll(); onParam(key); } },
  get time() { return time; },
  get end() { return endOf(P); },
  // Render one square frame at time t, independent of the on-screen canvas.
  async snapshot(t, side, fade = 0) {
    if (!logoData) await refreshLogo();
    if (!snapRenderer || snapCanvas.width !== side) {
      if (snapRenderer) snapRenderer.dispose();
      snapCanvas = document.createElement('canvas');
      snapCanvas.width = snapCanvas.height = side;
      snapRenderer = createRenderer(snapCanvas, { preserve: true });
    }
    renderShot(snapRenderer, t, fade, side, side, side / 1.9);
    return new Promise(res => snapCanvas.toBlob(res, 'image/png'));
  },
};
})();
</script>
</body>
</html>
